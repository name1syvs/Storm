<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Legal notice (Storm)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="doc-page">
    <header class="site-header">
      <nav class="nav-inner" aria-label="Main">
        <a class="brand" href="index.html"><span class="brand-text">Storm</span></a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="privacy.html">Privacy policy</a>
          <a href="legal-notice.html" aria-current="page">Legal notice</a>
          <a href="terms.html">Terms</a>
        </div>
      </nav>
    </header>

    <main>
      <div class="doc-head">
        <h1>Legal notice</h1>
        <p>Authoritative text loaded from the project markdown (English).</p>
      </div>
      <div id="doc" class="loading" role="region" aria-live="polite">Loading…</div>
    </main>

    <footer class="site-footer">
      <p><a href="index.html">← Back to home</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      (function () {
        var el = document.getElementById("doc");
        fetch("content/LegalNotice_EN.md")
          .then(function (r) {
            if (!r.ok) throw new Error("Could not load legal notice.");
            return r.text();
          })
          .then(function (md) {
            el.classList.remove("loading");
            el.innerHTML = marked.parse(md, { mangle: false, headerIds: true });
          })
          .catch(function (e) {
            el.classList.remove("loading");
            el.innerHTML =
              '<p class="doc-error">Could not load the document. Open this site via a local server (see Website/README.md) or check that <code>content/LegalNotice_EN.md</code> exists.</p>';
          });
      })();
    </script>
  </body>
</html>
