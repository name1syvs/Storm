<!DOCTYPE html>
<html lang="en" class="page-home">
  <head>
    <meta charset="utf-8" />

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const { createClient } = supabase;

        const supabaseUrl = "https://pyxhpdbnetlsqnexfsly.supabase.co";
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5eGhwZGJuZXRsc3FuZXhmc2x5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3OTUwOTYsImV4cCI6MjA4ODM3MTA5Nn0.Zcs6ozB7tueWlozpI1WX3QIt9gdySPeSgjq-A1UBm2s";

        const client = createClient(supabaseUrl, supabaseKey);

        const form = document.getElementById("waitlistForm");
        const emailInput = document.getElementById("emailInput");
        const successMsg = document.getElementById("successMsg");
        const botField = document.getElementById("stormHpField");
        const submitBtn = form ? form.querySelector(".capture-submit") : null;

        if (!form || !emailInput) return;

        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          // anti-bot (honeypot)
          if (botField && botField.value.trim() !== "") return;

          const email = emailInput.value;
          const originalLabel = submitBtn ? submitBtn.textContent : "";
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = "Joining…";
          }

          const { error } = await client
            .from("waitlist")
            .insert([{ email }]);

          if (error) {
            console.log("SUPABASE ERROR:", error);
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = originalLabel;
            }
            emailInput.setCustomValidity("This email could not be added. Please try again.");
            emailInput.reportValidity();
            return;
          }

          form.hidden = true;
          successMsg.hidden = false;
        });

        emailInput.addEventListener("input", () => emailInput.setCustomValidity(""));
      });
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Never be late again. Storm tells you exactly when to start getting ready and when to leave based on your calendar, traffic and weather."
    />
    <title>Storm — Never be late again</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="site-header">
      <nav class="nav-inner" aria-label="Main">
        <a class="brand" href="index.html"><span class="brand-text">Storm</span></a>
        <div class="nav-links">
          <a href="privacy.html">Privacy policy</a>
          <a href="legal-notice.html">Legal notice</a>
          <a href="terms.html">Terms</a>
          <a href="mailto:contact@getstorm.app">Contact</a>
        </div>
      </nav>
    </header>

    <main>
      <!-- HERO -->
      <section class="hero">
        <span class="eyebrow">Private beta · iOS</span>

        <h1 class="hero-title">Never be late again.</h1>

        <div class="hero-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>

        <p class="hero-hook">
              Plan less. Let Storm tell you when to prepare.
        </p>

        <form id="waitlistForm" class="capture-form">
          <label class="sr-only" for="emailInput">Email address</label>
          <input
            type="email"
            id="emailInput"
            placeholder="Enter your email"
            required
            autocomplete="email"
          />
          <input
            type="text"
            name="storm_hp_field"
            id="stormHpField"
            class="honeypot"
            tabindex="-1"
            aria-hidden="true"
            autocomplete="off"
          />
          <button class="capture-submit" type="submit">Join the beta</button>
        </form>

        <p id="successMsg" class="capture-success" hidden>
          <span class="capture-success-dot" aria-hidden="true"></span>
          You're on the list
        </p>

        <a class="link-ghost" href="mailto:contact@getstorm.app">Contact us</a>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        © Storm.
        <a href="privacy.html">Privacy</a>,
        <a href="legal-notice.html">Legal notice</a>,
        <a href="terms.html">Terms</a>
      </p>
    </footer>
  </body>
</html>
